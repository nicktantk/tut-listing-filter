# Public channel usernames (the part after t.me/). Case doesn't matter.
sources:
  - sgtuitions
  - sgtuitionjobs
  - tuitionassignments    # preview shows only "Channel created": check the username
  - littlewisertuition
  - elitetutorsg
  - tutoranywhr
  - tuition_east
  - nanyangtuitionjobs
  - eduaidtuition
  - tuitionassignmentsSG

criteria:
  # Any one of these words, matched as a whole word, case-insensitive.
  levels: [P4, P5, P6, Primary 4, Primary 5, Primary 6, Pri 4, Pri 5, Pri 6]  
  subjects: [Math, Maths, Mathematics, Science, English]
  locations:
    postal_prefixes: ["47"]    # used whenever the job gives a postal code
    towns: [Bedok, Eunos]      # only used when the job has no postal code
  exclude_online: true         # drops any post mentioning online, Zoom or virtual
  exclude_keywords: ["NIE teacher", "MOE teacher", "MOE/NIE"]
  # No minimum rate: rates are negotiable.
