criteria:
  # Any one of these words, matched as a whole word, case-insensitive.
  levels: [JC, JC1, JC2, J1, J2, Junior College, A Level, H1, H2]
  subjects: [Math, Maths, Mathematics, Physics]
  locations:
    postal_prefixes: ["51"]    # Pasir Ris, 51xxxx
    towns: [Pasir Ris]         # for posts that give a street but no postal code
  exclude_online: true         # drops any post mentioning online, Zoom or virtual
  exclude_keywords: ["female tutor only"]
  # No minimum rate: rates are negotiable.
