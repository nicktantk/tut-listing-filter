name: Daily tuition digest

on:
  schedule:
    # Times are UTC. Off the hour because GitHub drops many runs scheduled at :00.
    - cron: "7 0 * * *"    # 8:07 AM Singapore time
    - cron: "37 1 * * *"   # 9:37 AM backup; skipped if the 8 AM digest went out
  workflow_dispatch:      # "Run workflow" button for testing
    inputs:
      dry_run:
        description: "Dry run: print digests in the log instead of sending them"
        type: boolean
        default: false
      full_day:
        description: "Ignore saved state and read the last 24 hours"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # lets the job commit state.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
          HOME_POSTALS: ${{ secrets.HOME_POSTALS }}
          DRY_RUN: ${{ inputs.dry_run }}
          FULL_DAY: ${{ inputs.full_day }}
      - name: Save state
        run: |
          git config user.name "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update state" && git push)
